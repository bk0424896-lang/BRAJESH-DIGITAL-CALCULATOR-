name: Build APK - BK Smart Calculator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: "बीके स्मार्ट कैलकुलेटर"
  APP_ID: "com.bk.smartcalculator"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare project files
        run: |
          mkdir -p www

          if [ ! -f "www/index.html" ]; then
            HTML_FILE=$(find . -maxdepth 3 -name "*.html" ! -path "./.git/*" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
            else
              echo "Error: Repository mein koi HTML file nahi mili!"
              exit 1
            fi
          fi

          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "bk-smart-calculator",
            "version": "1.0.0",
            "private": true,
            "devDependencies": {
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            }
          }
          EOF
          fi

          cat << EOF > capacitor.config.json
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor dependencies
        run: npm install

      - name: Initialize Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bk-smart-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
